<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Dashboard | CapHacks</title>
  <link rel="icon" type="image/x-icon" href="images/icons/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/general.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body id="user-dashboard-page">
  <!-- Sidebar -->
  <aside class="dashboard-sidebar">
    <div class="sidebar-header">
      <a href="index.html"><img src="images/caphacks-logo.svg" alt="CapHacks Logo" class="sidebar-logo"></a>
      <button class="mobile-sidebar-close" id="sidebarCloseBtn" aria-label="Close sidebar"><i class="fas fa-times"></i></button>
    </div>

    <div class="sidebar-user-info">
      <div class="avatar" id="dashAvatar"><i class="fas fa-user"></i></div>
      <div class="info">
        <h3 id="dashName">Loading...</h3>
        <p id="dashEmail"></p>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-target="likedVideos">
        <i class="fas fa-star"></i> Liked Hacks
      </button>
      <button class="nav-item" data-target="savedVideos">
        <i class="fas fa-bookmark"></i> Bookmarked
      </button>
      <button class="nav-item" data-target="myUploads">
        <i class="fas fa-cloud-arrow-up"></i> Proof of Learning
      </button>
      <a href="video-hacks.html" class="nav-item back-link">
        <i class="fas fa-arrow-left"></i> Back to Tutorials
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="sign-out-btn" id="dashSignOutBtn"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="dashboard-main">
    <header class="dashboard-header-mobile">
      <button class="mobile-sidebar-open" id="sidebarOpenBtn" aria-label="Open sidebar"><i class="fas fa-bars"></i></button>
      <h2>Creator Dashboard</h2>
    </header>

    <div class="dashboard-content">
      <!-- Liked Videos Section -->
      <section id="likedVideos" class="dashboard-section active">
        <h2 class="section-title"><i class="fas fa-star" style="color: var(--accent-yellow);"></i> Liked Hacks</h2>
        <div class="grid-container" id="likedGrid">
          <p class="loading-text">Loading liked videos...</p>
        </div>
      </section>

      <!-- Saved Videos Section -->
      <section id="savedVideos" class="dashboard-section">
        <h2 class="section-title"><i class="fas fa-bookmark" style="color: var(--primary-color);"></i> Saved Hacks</h2>
        <div class="grid-container" id="savedGrid">
          <p class="loading-text">Loading saved videos...</p>
        </div>
      </section>

      <!-- My Uploads Section (Proof of Learning) -->
      <section id="myUploads" class="dashboard-section">
        <div class="section-header-row">
          <h2 class="section-title"><i class="fas fa-cloud-arrow-up" style="color: var(--secondary-color);"></i> My Proof of Learning <span class="badge">Edits</span></h2>
          <button class="colored-btn small-btn" id="openUploadProofBtn"><i class="fas fa-plus"></i> Upload Proof</button>
        </div>
        <div class="grid-container" id="uploadsGrid">
          <p class="loading-text">Loading your uploads...</p>
        </div>
      </section>
    </div>
  </main>

  <!-- Upload Proof Modal -->
  <div class="modal-overlay" id="uploadProofModal" aria-hidden="true">
    <div class="modal-content" role="dialog">
      <button class="modal-close" type="button" id="closeUploadProofBtn" aria-label="Close modal">&times;</button>
      <h2>Upload Proof of Learning</h2>
      <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 18px;">Show off what you created using a CapHacks tutorial!</p>

      <div class="upload-form">
        <label>
          <span>Learned from Tutorial:</span>
          <select id="proofTutorialSelect">
            <option value="">Loading tutorials...</option>
          </select>
        </label>

        <label>
          <span>Your Video File (MP4/MOV):</span>
          <input type="file" id="proofFile" accept="video/mp4,video/quicktime,video/mov">
        </label>

        <div id="proofProgress" style="display:none; margin-top: 10px;">
          <p id="proofStatus" style="font-size: 13px; margin-bottom: 6px; color: var(--primary-color);">Uploading...</p>
          <progress id="proofBar" value="0" max="100"></progress>
        </div>

        <button class="colored-btn" id="submitProofBtn" style="margin-top: 10px;"><i class="fas fa-upload"></i> Upload Video</button>
        <div class="login-error" id="proofError" style="margin-top: 10px;"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/globals.js"></script>
  <script src="js/cookies.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/user-dashboard.js"></script>
</body>
</html>
